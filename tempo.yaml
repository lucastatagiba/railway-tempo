# Grafana Tempo (single binary) — recebe OTLP e apaga traces após 14 dias.
# Local: docker run com -v tempo-data:/var/tempo e este ficheiro montado.
# Railway: volume em /var/tempo + OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo.railway.internal:4317

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1000000
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_compaction_objects: 1000000
    block_retention: 720h
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces
